<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VictoryVault - LMS Quiz App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --primary-color: #1E3A8A;
            --secondary-color: #3B82F6;
            --accent-color: #F59E0B;
            --background: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.5;
            box-sizing: border-box;
        }

        /* Responsive Navbar */
        nav {
            background: var(--primary-color);
            padding: 1rem 1.5rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0;
            color: white;
            text-decoration: none;
            background: linear-gradient(to right, #fff, var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            opacity: 0.9;
        }

        .nav-links a:hover {
            opacity: 1;
            color: var(--secondary-color);
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
            z-index: 1001;
        }

        .menu-toggle span {
            width: 28px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: var(--primary-color);
                padding: 1rem 0;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
                animation: slideDown 0.3s ease-out;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                padding: 12px 2rem;
                width: 100%;
                box-sizing: border-box;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 2rem auto;
            flex: 1;
        }

        h2 {
            color: var(--primary-color);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Form Controls */
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            border: 2px solid #E2E8F0;
            color: var(--text-primary);
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 14px 0 rgba(245, 158, 11, 0.39);
        }

        button:hover {
            background-color: #D97706;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
        }

        footer {
            background: white;
            padding: 3rem 0;
            border-top: 1px solid #E2E8F0;
            color: var(--text-secondary);
            text-align: center;
        }

        footer strong {
            color: var(--primary-color);
        }

        /* Generic Utilities */
        .table-responsive {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: var(--text-color);
            font-weight: 700;
        }

        /* Quiz & Question Cards */
        .question-card {
            background: white;
            padding: 2.5rem;
            margin-bottom: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border-left: 8px solid var(--primary-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 2rem;
            line-height: 1.6;
            display: flex;
            gap: 15px;
        }

        .q-number {
            color: var(--primary-color);
            background: rgba(108, 92, 231, 0.1);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .options {
            display: grid;
            gap: 15px;
        }

        .options label {
            display: flex;
            align-items: center;
            padding: 18px 25px;
            background: #f8f9fa;
            border: 2.5px solid #eee;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 600;
            color: #4a4a4a;
            position: relative;
        }

        .options label:hover {
            background: #fff;
            border-color: var(--secondary-color);
            transform: translateX(5px);
        }

        .options input[type="radio"] {
            margin-right: 20px;
            width: 22px;
            height: 22px;
            accent-color: var(--primary-color);
            cursor: pointer;
            flex-shrink: 0;
        }

        .options label.selected {
            background: rgba(108, 92, 231, 0.08);
            border-color: var(--primary-color);
            color: var(--primary-color);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.15);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 30px;
        }

        .loading::after {
            content: "Crafting your VictoryVault experience...Please wait 30 seconds";
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.1rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.4;
            }
        }

        @media (max-width: 768px) {
            .question-card {
                padding: 1.5rem;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .options label {
                padding: 15px;
                font-size: 0.95rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: true });</script>
</head>

<body>
    <nav>
        <a href="{% url 'dashboard' %}" class="nav-logo">VictoryVault</a>
        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-links" id="nav-links">
            {% if user.is_authenticated %}
            <span style="font-weight: 600; font-size: 0.9rem; opacity: 0.9;">Hi, {{ user.username }}</span>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'history_list' %}">History</a>
            <a href="{% url 'logout' %}"
                style="background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px;">Logout</a>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 - <strong>Mohd Sarwar Babu</strong>. All Rights Reserved.</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">Empowering your learning journey with
            VictoryVault.</p>
    </footer>

    <script>
        document.getElementById('mobile-menu').addEventListener('click', function () {
            document.getElementById('nav-links').classList.toggle('active');
        });
    </script>
</body>

</html>
