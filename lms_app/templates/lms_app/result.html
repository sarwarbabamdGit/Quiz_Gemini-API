{% extends 'lms_app/base.html' %}

{% block content %}
<div class="card" style="text-align: center;">
    <h2 style="font-size: 2.5rem; margin-bottom: 1rem;">Quiz Results</h2>
    <div style="font-size: 1.5rem; margin-bottom: 2rem;">
        Topic: <span style="color: var(--primary-color);">{{ topic }}</span>
    </div>

    <div style="
        width: 200px; 
        height: 200px; 
        border-radius: 50%; 
        border: 10px solid var(--secondary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        font-size: 3rem;
        font-weight: bold;
        color: var(--primary-color);
    ">
        {{ score }} / {{ total }}
    </div>

    <p style="font-size: 1.2rem;">
        You scored <strong>{{ score }}</strong> out of <strong>{{ total }}</strong>.
    </p>

    <a href="{% url 'dashboard' %}" style="
        display: inline-block;
        background: var(--primary-color);
        color: white;
        padding: 15px 30px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: bold;
        margin-top: 20px;
        transition: transform 0.2s;
    ">Take Another Quiz</a>
</div>
{% endblock %}
